name: Build

on:
  push:
  pull_request:

# The build only reads the code: it gets no write access and uses no secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to an exact commit, so a changed tag can never slip different code into the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build with the .NET Framework compiler
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TonelineEQ-build
          path: out/
